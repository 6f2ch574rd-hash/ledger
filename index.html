<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="記帳本">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='32' fill='%239E203E'/><text x='90' y='120' font-size='80' text-anchor='middle' fill='white'>📒</text></svg>">
<title>LocalLedger 雲端版</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
<style>
body{background:#fff;padding-bottom:100px;font-family:sans-serif;margin:0;}
.wrap{max-width:800px;margin:0 auto;padding:0 16px;}
.toast{position:fixed;top:15px;right:15px;background:#28a745;color:#fff;padding:10px 16px;border-radius:8px;z-index:9999;}
.toast.err{background:#dc3545;}.toast.warn{background:#fd7e14;}
.nav{position:fixed;bottom:12px;left:12px;right:12px;background:#fff;border-radius:16px;box-shadow:0 -2px 16px rgba(0,0,0,0.15);display:flex;z-index:999;}
.nav button{flex:1;border:none;background:none;padding:18px 4px;font-size:15px;color:#888;}
.nav button.active{color:#9E203E;font-weight:bold;}
.page{display:none;}.page.active{display:block;}
.btn{border:none;border-radius:8px;padding:12px 18px;cursor:pointer;font-size:15px;}
.btn-wine{background:#9E203E;color:#fff;}.btn-green{background:#27AE60;color:#fff;}
.btn-gray{background:#f5f5f5;color:#333;}.btn-ghost{background:#fff;border:1px solid #9E203E;color:#9E203E;}
.card{border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,0.08);margin:16px 0;overflow:hidden;}
.card-head{background:#9E203E;color:#fff;padding:12px 16px;font-weight:500;}
.card-head.green-head{background:#27AE60;}
.card-body{padding:16px;}
input,select{width:100%;padding:10px;margin:4px 0 12px;border:1px solid #ddd;border-radius:8px;font-size:15px;}
.tag{font-size:12px;padding:2px 6px;border-radius:4px;background:#F7E8EB;color:#8B1A33;}
.tag.green{background:#E8F8F0;color:#1B7A3E;}
table{width:100%;border-collapse:collapse;}td,th{padding:8px;border-bottom:1px solid #eee;}
.quick-tag{display:inline-flex;align-items:center;border:1px solid #9E203E;border-radius:6px;margin:3px;overflow:hidden;}
.quick-tag button{border:none;background:#fff;color:#9E203E;padding:4px 10px;cursor:pointer;}
.quick-tag .del{border-left:1px solid #9E203E;padding:4px 8px;background:#F7E8EB;}
.quick-range-btn{flex:1;padding:10px;border:1px solid #ddd;background:#fff;border-radius:8px;cursor:pointer;font-size:14px;}
.quick-range-btn.active{background:#9E203E;color:#fff;border-color:#9E203E;}
</style>
</head>
<body>
<div class="wrap">
<h2 style="color:#9E203E">📒 LocalLedger <span id="syncDot" style="display:inline-block;width:12px;height:12px;border-radius:50%;background:#28a745;margin-left:6px;cursor:pointer;" onclick="showSyncStatus()"></span></h2>

<div class="page active" id="pageRecord">
<div class="card" style="background:linear-gradient(135deg,#9E203E,#7a1830);color:#fff;">
<div class="card-body" style="padding:20px 16px;">
<p style="margin:0 0 4px;font-size:13px;opacity:0.85;">本月帳戶餘額</p>
<p style="margin:0 0 14px;font-size:30px;font-weight:bold;" id="homeBalance">0</p>
<div style="display:flex;gap:10px;">
<div style="flex:1;background:rgba(255,255,255,0.15);border-radius:10px;padding:10px;text-align:center;font-size:13px;">💸 支出<br><strong id="homeExp" style="font-size:17px;">0</strong></div>
<div style="flex:1;background:rgba(255,255,255,0.15);border-radius:10px;padding:10px;text-align:center;font-size:13px;">💰 收入<br><strong id="homeInc" style="font-size:17px;">0</strong></div>
</div>
</div></div>
<div class="card"><div class="card-head" style="background:#fff;color:#9E203E;font-size:14px;border-bottom:1px solid #f0e0e4;padding:10px 16px;">📂 點擊分類查看明細</div><div class="card-body" style="padding:10px 16px;" id="homeCatList"></div></div>
<div class="card"><div class="card-head" id="cardTitle">記支出</div><div class="card-body">
<div style="display:flex;border:1px solid #eee;border-radius:10px;overflow:hidden;margin-bottom:12px;">
<button class="btn btn-wine" id="btnExp" style="flex:1;border-radius:0;" onclick="setType('expense')">💸 支出</button>
<button class="btn btn-gray" id="btnInc" style="flex:1;border-radius:0;" onclick="setType('income')">💰 收入</button>
</div>
<label>常用分類（點選快速填入，×刪除）</label>
<div id="quickCatBar" style="margin-bottom:12px;"></div>
<div style="display:flex;gap:8px;margin-bottom:16px;">
<input id="newCatInput" placeholder="新分類名稱" style="flex:1;margin:0;">
<button class="btn btn-wine" onclick="addNewCat()">＋新增</button>
</div>
<label>日期</label><input type="date" id="fDate">
<label>名稱 *</label><input id="fName" placeholder="例：午餐、薪水">
<label>金額 *</label><input type="number" step="0.01" id="fAmount">
<label>分類（留空自動歸其他）</label><input id="fCat">
<label>備註（選填）</label><input id="fNote">
<div style="display:flex;gap:10px;margin-top:12px;">
<button class="btn btn-wine" id="saveBtn" onclick="doSave()">💾 儲存紀錄</button>
<button class="btn btn-ghost" onclick="doClear()">🔄 清空表單</button>
</div>
</div></div>
</div>

<div class="page" id="pageList">
<div class="card"><div class="card-head">收支清單</div><div class="card-body">
<div style="display:flex;gap:8px;">
<select id="filterType" onchange="renderList()" style="flex:1;margin:0 0 12px;">
<option value="all">全部類型</option><option value="expense">僅支出</option><option value="income">僅收入</option>
</select>
<select id="filterCat" onchange="renderList()" style="flex:1;margin:0 0 12px;">
<option value="all">全部分類</option>
</select>
</div>
<div id="listBox"></div>
</div></div>
</div>

<div class="page" id="pageStat">
<div class="card"><div class="card-head">統計</div><div class="card-body">
<div style="display:flex;gap:6px;margin-bottom:12px;">
<button class="quick-range-btn" onclick="setRange('today',this)">今天</button>
<button class="quick-range-btn" onclick="setRange('week',this)">本週</button>
<button class="quick-range-btn active" onclick="setRange('month',this)">本月</button>
<button class="quick-range-btn" onclick="setRange('year',this)">今年</button>
<button class="quick-range-btn" onclick="setRange('all',this)">全部</button>
</div>
<p style="font-size:13px;color:#666;">或自訂區間：</p>
<div style="display:flex;gap:10px;">
<input type="date" id="statStart" style="flex:1;margin:0;">
<input type="date" id="statEnd" style="flex:1;margin:0;">
</div>
<div style="display:flex;gap:10px;margin:16px 0;">
<div style="flex:1;padding:16px;background:#F7E8EB;border-radius:12px;text-align:center;">💸 總支出<br><strong id="stExp" style="font-size:22px;color:#9E203E;">0</strong></div>
<div style="flex:1;padding:16px;background:#E8F8F0;border-radius:12px;text-align:center;">💰 總收入<br><strong id="stInc" style="font-size:22px;color:#27AE60;">0</strong></div>
</div>
<p style="font-size:18px;text-align:center;">總餘額：<strong id="stTotal" style="font-size:22px;color:#2c5aa0;">0</strong></p>
<h4 style="margin:20px 0 10px;color:#9E203E;">🎨 分類占比
<span style="float:right;">
<button id="pieTypeExp" style="background:#9E203E;color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:13px;" onclick="switchPieType('expense')">支出</button>
<button id="pieTypeInc" style="background:#f5f5f5;color:#333;border:none;border-radius:6px;padding:4px 10px;font-size:13px;margin-left:4px;" onclick="switchPieType('income')">收入</button>
</span></h4>
<div style="max-height:320px;"><canvas id="pieChart"></canvas></div>
</div></div>
</div>

<div class="page" id="pageBackup">
<div class="card"><div class="card-head">備份</div><div class="card-body">
<button class="btn btn-wine" style="width:100%;margin-bottom:16px;" onclick="doExport()">📤 匯出CSV備份</button>
<label>選擇CSV檔案</label>
<input type="file" id="impFile" accept=".csv">
<div id="impStatus" style="font-size:14px;color:#666;margin:8px 0;"></div>
<button class="btn btn-wine" id="btnReadImp" style="width:100%;margin-top:8px;display:none;" onclick="readImportFile()">📖 開始讀取檔案</button>
<button class="btn btn-green" id="btnDoImp" style="width:100%;margin-top:8px;display:none;" onclick="doImport()">✅ 確認匯入</button>
</div></div>
</div>
</div>

<div class="nav">
<button class="active" onclick="goPage('pageRecord',this)">記帳</button>
<button onclick="goPage('pageList',this)">清單</button>
<button onclick="goPage('pageStat',this)">統計</button>
<button onclick="goPage('pageBackup',this)">備份</button>
</div>

<script>
const SUPABASE_URL = "https://htqhybhvsvekhqxsmjph.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh0cWh5Ymh2c3Zla2hxeHNtanBoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyMDY1MDgsImV4cCI6MjEwNTc4MjUwOH0.SaLSUCuPJLA6yTuSatUsfW7J77nSld_8DUiCypFwhAo";
const FIXED_UID = "my-personal-ledger";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentType = "expense";
let allData = [];
let quickCats = JSON.parse(localStorage.getItem("localLedgerCats") || '["餐飲","交通","購物","娛樂","居家","醫療","薪水"]');
let editingId = null;
let pendingRows = null;
let pendingFormat = 6; // 預設軟體自身匯出格式，6欄；10為手寫記錄格式
let pieShowType = "expense";
let pieChart = null;
const chartPalette = ["#9E203E","#E8A0A8","#E67E5A","#E8C56A","#4A8B6F","#6A8FBF","#9B7FBF","#D9B38C"];

function toast(msg, color="#28a745"){
  const t = document.createElement("div");
  t.className = "toast"; t.style.background = color; t.textContent = msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2200);
}
function today(){ return new Date().toISOString().slice(0,10); }
function saveCats(){ localStorage.setItem("localLedgerCats", JSON.stringify(quickCats)); renderCats(); }
function showSyncStatus(){
  const dot = document.getElementById("syncDot");
  if(dot.style.background === "#28a745") toast("目前狀態：雲端同步正常", "#17a2b8");
  else toast("目前狀態：雲端連線異常，請稍後再試", "#dc3545");
}

function goPage(pid, btnEl){
  document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
  btnEl.classList.add("active");
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(pid).classList.add("active");
  toast("已切換頁面");
}
function setType(type){
  currentType = type;
  const btnExp = document.getElementById("btnExp"), btnInc = document.getElementById("btnInc");
  const cardTitle = document.getElementById("cardTitle"), saveBtn = document.getElementById("saveBtn");
  if(type==="expense"){
    cardTitle.textContent = "記支出"; cardTitle.classList.remove("green-head");
    btnExp.className = "btn btn-wine"; btnInc.className = "btn btn-gray"; saveBtn.className = "btn btn-wine";
    toast("切換為支出模式");
  }else{
    cardTitle.textContent = "記收入"; cardTitle.classList.add("green-head");
    btnInc.className = "btn btn-green"; btnExp.className = "btn btn-gray"; saveBtn.className = "btn btn-green";
    toast("切換為收入模式");
  }
}
function renderCats(){
  const bar = document.getElementById("quickCatBar"); bar.innerHTML = "";
  quickCats.forEach((cat, idx)=>{
    const wrap = document.createElement("span"); wrap.className = "quick-tag";
    const btn = document.createElement("button"); btn.textContent = cat;
    btn.onclick = ()=>{ document.getElementById("fCat").value = cat; toast("已填入分類："+cat); };
    const del = document.createElement("button"); del.className = "del"; del.textContent = "×";
    del.onclick = (e)=>{ e.stopPropagation(); quickCats.splice(idx,1); saveCats(); toast("已刪除分類："+cat,"#fd7e14"); };
    wrap.appendChild(btn); wrap.appendChild(del); bar.appendChild(wrap);
  });
}
function addNewCat(){
  const val = document.getElementById("newCatInput").value.trim();
  if(!val){toast("請輸入分類名稱","#fd7e14");return;}
  if(quickCats.includes(val)){toast("分類已存在","#fd7e14");return;}
  quickCats.push(val); saveCats(); document.getElementById("newCatInput").value=""; toast("✅ 新增分類："+val);
}
function doClear(){
  editingId = null;
  document.getElementById("fDate").value = today();
  document.getElementById("fName").value = ""; document.getElementById("fAmount").value = "";
  document.getElementById("fCat").value = ""; document.getElementById("fNote").value = "";
  toast("表單已清空");
}
async function doSave(){
  const rec = {
    user_id: FIXED_UID, date: document.getElementById("fDate").value,
    name: document.getElementById("fName").value.trim(),
    category: document.getElementById("fCat").value.trim() || "其他",
    amount: Number(document.getElementById("fAmount").value),
    type: currentType, note: document.getElementById("fNote").value.trim()
  };
  if(!rec.date){toast("請選日期","#dc3545");return;}
  if(!rec.name){toast("請填名稱","#dc3545");return;}
  if(isNaN(rec.amount)){toast("請填正確金額","#dc3545");return;}
  try{
    if(editingId){
      await sb.from("transactions").update(rec).eq("id", editingId);
      toast("✅ 記錄已更新"); editingId = null;
    }else{
      await sb.from("transactions").insert(rec);
      toast(currentType==="income"?"✅ 收入已入帳":"✅ 支出已記錄");
    }
    doClear(); await loadData();
  }catch(e){ toast("❌ 儲存失敗："+e.message, "#dc3545"); }
}
async function loadData(){
  try{
    const {data} = await sb.from("transactions").select("*").eq("user_id", FIXED_UID).order("date",{ascending:false});
    allData = data || [];
    document.getElementById("syncDot").style.background = "#28a745";
    renderList(); renderStat(); renderHomeSummary();
  }catch(e){
    document.getElementById("syncDot").style.background = "#dc3545";
    toast("⚠️ 雲端連線失敗："+e.message, "#dc3545");
  }
}
function renderList(){
  const filter = document.getElementById("filterType").value;
  const filterCat = document.getElementById("filterCat").value;
  const catSet = [...new Set(allData.map(r=>r.category))];
  const catSel = document.getElementById("filterCat");
  const curCat = catSel.value;
  catSel.innerHTML = '<option value="all">全部分類</option>' + catSet.map(c=>`<option value="${c}" ${c===curCat?'selected':''}>${c}</option>`).join("");
  let data = [...allData];
  if(filter!=="all") data = data.filter(r=>r.type===filter);
  if(filterCat!=="all") data = data.filter(r=>r.category===filterCat);
  const box = document.getElementById("listBox");
  if(data.length===0){box.innerHTML="<p style='color:#888'>尚無記錄</p>";return;}
  let html = "<table><tr><th>日期</th><th>名稱</th><th>金額</th><th></th></tr>";
  data.forEach(r=>{
    const color = r.type==="income"?"#27AE60":"#9E203E";
    html += `<tr><td>${r.date}</td><td>${r.name}<br><span class="tag ${r.type==='income'?'green':''}">${r.category}</span></td>
    <td style="color:${color};font-weight:bold;">${r.amount}</td>
    <td><button style="color:#9E203E;border:none;background:none;cursor:pointer;margin-right:6px;" onclick="editRecord(${r.id})">編輯</button>
    <button style="color:#27AE60;border:none;background:none;cursor:pointer;margin-right:6px;" onclick="cloneRecord(${r.id})">複製</button>
    <button style="color:red;border:none;background:none;cursor:pointer;" onclick="doDel(${r.id})">刪除</button></td></tr>`;
  });
  box.innerHTML = html + "</table>";
}
function goCategory(cat, type){
  document.getElementById("filterType").value = type;
  document.getElementById("filterCat").value = cat;
  renderList();
  toast(`已篩選「${cat}」明細`);
  goPage("pageList", document.querySelectorAll(".nav button")[1]);
}
function renderHomeSummary(){
  const now = new Date();
  const ms = new Date(now.getFullYear(),now.getMonth(),1).toISOString().slice(0,10);
  const me = today();
  let exp=0,inc=0; const expCat={}, incCat={};
  allData.forEach(r=>{
    if(r.date<ms||r.date>me) return;
    if(r.type==="expense"){exp+=r.amount; expCat[r.category]=(expCat[r.category]||0)+r.amount;}
    else{inc+=r.amount; incCat[r.category]=(incCat[r.category]||0)+r.amount;}
  });
  document.getElementById("homeExp").textContent = exp.toLocaleString();
  document.getElementById("homeInc").textContent = inc.toLocaleString();
  const bal = inc-exp;
  const balEl = document.getElementById("homeBalance");
  balEl.textContent = (bal>=0?"":"-")+"NT$"+Math.abs(bal).toLocaleString();
  const box = document.getElementById("homeCatList");
  let html = "";
  const expEntries = Object.entries(expCat).sort((a,b)=>b[1]-a[1]);
  const incEntries = Object.entries(incCat).sort((a,b)=>b[1]-a[1]);
  if(expEntries.length===0 && incEntries.length===0){
    box.innerHTML = "<p style='color:#aaa;font-size:13px;margin:4px 0;'>本月尚無記錄</p>";
    return;
  }
  expEntries.forEach(([cat,amt])=>{
    html += `<div onclick="goCategory('${cat}','expense')" style="display:flex;justify-content:space-between;align-items:center;padding:9px 4px;border-bottom:1px solid #f5f0f1;cursor:pointer;">
      <span style="font-size:14px;">💸 ${cat}</span>
      <span style="font-size:14px;font-weight:bold;color:#9E203E;">${amt.toLocaleString()}</span></div>`;
  });
  incEntries.forEach(([cat,amt])=>{
    html += `<div onclick="goCategory('${cat}','income')" style="display:flex;justify-content:space-between;align-items:center;padding:9px 4px;border-bottom:1px solid #f0f7f3;cursor:pointer;">
      <span style="font-size:14px;">💰 ${cat}</span>
      <span style="font-size:14px;font-weight:bold;color:#27AE60;">${amt.toLocaleString()}</span></div>`;
  });
  box.innerHTML = html;
}
function editRecord(id){
  const rec = allData.find(r=>r.id===id); if(!rec) return;
  editingId = id; setType(rec.type);
  document.getElementById("fDate").value = rec.date; document.getElementById("fName").value = rec.name;
  document.getElementById("fAmount").value = rec.amount;
  document.getElementById("fCat").value = rec.category==="其他"?"":rec.category;
  document.getElementById("fNote").value = rec.note||"";
  toast("已載入記錄到編輯模式");
  goPage("pageRecord", document.querySelectorAll(".nav button")[0]);
}
function cloneRecord(id){
  const rec = allData.find(r=>r.id===id); if(!rec) return;
  editingId = null; setType(rec.type);
  document.getElementById("fDate").value = today(); document.getElementById("fName").value = rec.name;
  document.getElementById("fAmount").value = rec.amount;
  document.getElementById("fCat").value = rec.category==="其他"?"":rec.category;
  document.getElementById("fNote").value = rec.note||"";
  toast("已複製舊記錄，改完直接儲存");
  goPage("pageRecord", document.querySelectorAll(".nav button")[0]);
}
async function doDel(id){
  try{
    await sb.from("transactions").delete().eq("id", id);
    toast("✅ 記錄已刪除");
    await loadData();
  }catch(e){ toast("❌ 刪除失敗","#dc3545"); }
}
function setRange(type, btnEl){
  document.querySelectorAll(".quick-range-btn").forEach(b=>b.classList.remove("active"));
  btnEl.classList.add("active");
  const now = new Date(); let s,e;
  if(type==="today"){s=e=today();}
  else if(type==="week"){const d=now.getDay()||7;const st=new Date(now);st.setDate(now.getDate()-d+1);s=st.toISOString().slice(0,10);e=today();}
  else if(type==="month"){s=new Date(now.getFullYear(),now.getMonth(),1).toISOString().slice(0,10);e=today();}
  else if(type==="year"){s=new Date(now.getFullYear(),0,1).toISOString().slice(0,10);e=today();}
  else {s="2000-01-01";e=today();}
  document.getElementById("statStart").value=s; document.getElementById("statEnd").value=e;
  toast("已切換統計範圍"); renderStat();
}
function switchPieType(type){
  pieShowType = type;
  const btnExp = document.getElementById("pieTypeExp"), btnInc = document.getElementById("pieTypeInc");
  if(type==="expense"){
    btnExp.style.background="#9E203E";btnExp.style.color="#fff";
    btnInc.style.background="#f5f5f5";btnInc.style.color="#333";
  }else{
    btnInc.style.background="#27AE60";btnInc.style.color="#fff";
    btnExp.style.background="#f5f5f5";btnExp.style.color="#333";
  }
  renderStat();
}
function renderStat(){
  const s = document.getElementById("statStart").value, e = document.getElementById("statEnd").value;
  let exp=0,inc=0; const expCat={}, incCat={};
  allData.forEach(r=>{
    if(r.date<s||r.date>e) return;
    if(r.type==="expense"){exp+=r.amount; expCat[r.category]=(expCat[r.category]||0)+r.amount;}
    else{inc+=r.amount; incCat[r.category]=(incCat[r.category]||0)+r.amount;}
  });
  document.getElementById("stExp").textContent=exp.toLocaleString();
  document.getElementById("stInc").textContent=inc.toLocaleString();
  document.getElementById("stTotal").textContent=(inc-exp).toLocaleString();
  const currentData = pieShowType==="expense"?expCat:incCat;
  if(pieChart) pieChart.destroy();
  const ctx = document.getElementById("pieChart").getContext("2d");
  pieChart = new Chart(ctx,{
    type:"doughnut",
    data:{labels:Object.keys(currentData),datasets:[{data:Object.values(currentData),backgroundColor:chartPalette,borderWidth:3,borderColor:"#fff",hoverOffset:12}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:"55%",plugins:{legend:{position:"bottom",labels:{padding:12,font:{size:13}}},tooltip:{callbacks:{label:c=>{const total=c.dataset.data.reduce((a,b)=>a+b,0);const pct=((c.raw/total)*100).toFixed(1);return ` ${c.label}: NT$${c.raw.toLocaleString()} (${pct}%)`;}}}}},
    plugins:[{id:"pct",afterDraw:c=>{const ctx=c.ctx;c.data.datasets[0].data.forEach((v,i)=>{const total=c.data.datasets[0].data.reduce((a,b)=>a+b,0);const pct=((v/total)*100).toFixed(0);if(pct<5)return;const pos=c.getDatasetMeta(0).data[i].tooltipPosition();ctx.fillStyle="#fff";ctx.font="bold 13px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(pct+"%",pos.x,pos.y);});}}]
  });
}
function doExport(){
  toast("正在產生備份...","#fd7e14");
  let csv = "date,name,category,amount,type,note\n";
  allData.forEach(r=>csv+=`${r.date},"${r.name}",${r.category},${r.amount},${r.type},"${r.note||""}"\n`);
  const blob = new Blob(["\ufeff"+csv]);
  const a = document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download = `備份_${today()}.csv`; a.click();
  localStorage.setItem("lastBackupTime", Date.now());
  toast("✅ 備份已下載");
}
document.getElementById("impFile").addEventListener("change", function(e){
  if(!e.target.files[0]) return;
  document.getElementById("impStatus").textContent = "已選擇：" + e.target.files[0].name;
  document.getElementById("btnReadImp").style.display = "block";
  toast("選好檔案了，點開始讀取","#17a2b8");
});
function readImportFile(){
  const f = document.getElementById("impFile").files[0];
  if(!f){toast("請先選檔案","#fd7e14");return;}
  toast("正在讀取檔案...","#fd7e14");
  const reader = new FileReader();
  reader.onload = async function(ev){
    let text = ev.target.result;
    if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
    const lines = text.split(/\r?\n/).filter(l=>l.trim()!=="");
    const header = lines[0].split(",")[0];
    pendingFormat = (header.trim() === "日期") ? 10 : 6;
    pendingRows = lines.slice(1).map(l=>l.split(","));
    document.getElementById("impStatus").textContent = `讀到 ${pendingRows.length} 筆，格式${pendingFormat==10?"(手寫記錄)":"(軟體備份)"}，點確認匯入`;
    document.getElementById("btnDoImp").style.display = "block";
    toast(`✅ 讀取成功，共 ${pendingRows.length} 筆，已自動識別格式`);
  };
  reader.readAsText(f,"utf-8");
}
async function doImport(){
  if(!pendingRows){toast("請先讀取檔案","#fd7e14");return;}
  toast("開始匯入...","#fd7e14");
  let ok=0,skip=0;
  for(const cols of pendingRows){
    if(cols.length<4){skip++;continue;}
    try{
      let date, name, category, amount, type, note;
      if(pendingFormat === 10){
        date = cols[0];
        name = cols[2].replace(/"/g,"");
        category = cols[3]||"其他";
        amount = Number(cols[4]);
        type = (cols[9]||"支出").trim()==="收入"?"income":"expense";
        note = cols[7]||"";
      }else{
        date = cols[0];
        name = cols[1].replace(/"/g,"");
        category = cols[2]||"其他";
        amount = Number(cols[3]);
        type = (cols[4]||"expense").trim();
        note = cols[5]||"";
      }
      if(isNaN(amount) || amount<=0){skip++;continue;}
      await sb.from("transactions").insert({
        user_id: FIXED_UID, date, name, category, amount, type, note
      });
      ok++;
    }catch(e){skip++;}
  }
  toast(`✅ 匯入完成：成功${ok}筆，略過${skip}筆`);
  document.getElementById("impFile").value=""; document.getElementById("impStatus").textContent="";
  document.getElementById("btnReadImp").style.display="none"; document.getElementById("btnDoImp").style.display="none";
  pendingRows=null; await loadData();
  const {count, error: cErr} = await sb.from("transactions").select("*", {count: "exact"});
  if(cErr) toast("⚠️ 讀取雲端筆數失敗："+cErr.message, "#dc3545");
  else toast(`📊 雲端目前總共存了 ${count} 筆記錄`, "#17a2b8");
  renderList();
}

window.onload = async function(){
  toast("雲端版啟動中...","#17a2b8");
  document.getElementById("fDate").value = today();
  renderCats();
  await loadData();
  renderHomeSummary();
  toast("🎉 歡迎回來，記帳本已就緒");
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").then(() => {
        toast("✅ 已開啟離線本地儲存功能", "#17a2b8");
      }).catch(() => {});
    });
  }
};
</script>
