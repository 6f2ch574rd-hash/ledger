<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LocalLedger</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#fff;padding-bottom:100px;font-family:sans-serif;}
.wrap{max-width:800px;margin:0 auto;padding:0 16px;}
.toast{position:fixed;top:15px;right:15px;background:#28a745;color:#fff;padding:10px 16px;border-radius:8px;z-index:9999;}
.nav{position:fixed;bottom:12px;left:12px;right:12px;background:#fff;border-radius:16px;box-shadow:0 -2px 16px rgba(0,0,0,0.15);display:flex;z-index:999;}
.nav button{flex:1;border:none;background:none;padding:18px 4px;font-size:15px;color:#888;}
.nav button.active{color:#9E203E;font-weight:bold;}
.page{display:none;}.page.active{display:block;}
.btn{border:none;border-radius:8px;padding:12px 18px;cursor:pointer;font-size:15px;}
.btn-wine{background:#9E203E;color:#fff;}
.btn-ghost{background:#fff;border:1px solid #9E203E;color:#9E203E;}
.card{border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,0.08);margin:16px 0;overflow:hidden;}
.card-head{background:#9E203E;color:#fff;padding:12px 16px;font-weight:500;}
.card-body{padding:16px;}
input,select{width:100%;padding:10px;margin:4px 0 12px;border:1px solid #ddd;border-radius:8px;font-size:15px;}
.tag{font-size:12px;padding:2px 6px;border-radius:4px;background:#F7E8EB;color:#8B1A33;}
table{width:100%;border-collapse:collapse;}td,th{padding:8px;border-bottom:1px solid #eee;}
</style>
</head>
<body>
<div class="wrap">
<h2 style="color:#9E203E">📒 LocalLedger</h2>

<div class="page active" id="pageRecord">
<div class="card">
<div class="card-head" id="cardTitle">記支出</div>
<div class="card-body">
<div style="display:flex;border:1px solid #eee;border-radius:10px;overflow:hidden;margin-bottom:12px;">
<button class="btn btn-wine" id="btnExp" style="flex:1;border-radius:0;" onclick="setType('expense')">💸 支出</button>
<button class="btn" style="flex:1;border-radius:0;background:#f5f5f5;" onclick="setType('income')">💰 收入</button>
</div>
<label>日期</label><input type="date" id="fDate">
<label>名稱 *</label><input id="fName" placeholder="例：午餐、薪水">
<label>金額 *</label><input type="number" step="0.01" id="fAmount">
<label>分類（留空自動歸其他）</label><input id="fCat">
<label>備註（選填）</label><input id="fNote">
<div style="display:flex;gap:10px;margin-top:12px;">
<button class="btn btn-wine" onclick="doSave()">💾 儲存</button>
<button class="btn btn-ghost" onclick="doClear()">🔄 清空</button>
</div>
</div>
</div>
</div>

<div class="page" id="pageList">
<div class="card">
<div class="card-head">收支清單</div>
<div class="card-body">
<select id="filterType" onchange="renderList()">
<option value="all">全部</option><option value="expense">僅支出</option><option value="income">僅收入</option>
</select>
<div id="listBox"></div>
</div>
</div>
</div>

<div class="page" id="pageStat">
<div class="card">
<div class="card-head">統計</div>
<div class="card-body">
<label>開始日期</label><input type="date" id="statStart">
<label>結束日期</label><input type="date" id="statEnd">
<div style="display:flex;gap:10px;margin:12px 0;">
<div style="flex:1;padding:12px;background:#F7E8EB;border-radius:8px;text-align:center;">支出<br><strong id="stExp">0</strong></div>
<div style="flex:1;padding:12px;background:#E8F8F0;border-radius:8px;text-align:center;">收入<br><strong id="stInc">0</strong></div>
</div>
<p>累計餘額：<strong id="stTotal">0</strong></p>
</div>
</div>
</div>

<div class="page" id="pageBackup">
<div class="card">
<div class="card-head">備份</div>
<div class="card-body">
<button class="btn btn-wine" style="width:100%;margin-bottom:12px;" onclick="doExport()">📤 匯出CSV</button>
<label>選擇檔案匯入</label><input type="file" id="impFile">
<button class="btn btn-wine" style="width:100%;margin-top:12px;display:none;" id="btnImp" onclick="doImport()">✅ 確認匯入</button>
</div>
</div>
</div>

</div>

<div class="nav">
<button class="active" onclick="goPage('pageRecord',this)">記帳</button>
<button onclick="goPage('pageList',this)">清單</button>
<button onclick="goPage('pageStat',this)">統計</button>
<button onclick="goPage('pageBackup',this)">備份</button>
</div>

<script>
// ========== 所有函數全局定義，打開就存在，絕對不會「沒反應」 ==========
let currentType = "expense";
let allData = [];
let sb = null;
let importRows = null;

function toast(msg){
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2000);
}
function today(){ return new Date().toISOString().slice(0,10); }

function goPage(pid, btnEl){
  document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
  btnEl.classList.add("active");
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(pid).classList.add("active");
  toast("已切換頁面");
}
function setType(type){
  currentType = type;
  const btnExp = document.getElementById("btnExp");
  const cardTitle = document.getElementById("cardTitle");
  if(type === "expense"){
    cardTitle.textContent = "記支出";
    btnExp.className = "btn btn-wine";
    toast("切換為支出模式");
  }else{
    cardTitle.textContent = "記收入";
    btnExp.className = "btn";
    toast("切換為收入模式");
  }
}
function doClear(){
  document.getElementById("fDate").value = today();
  document.getElementById("fName").value = "";
  document.getElementById("fAmount").value = "";
  document.getElementById("fCat").value = "";
  document.getElementById("fNote").value = "";
  toast("表單已清空");
}
async function doSave(){
  toast("正在儲存...");
  const rec = {
    user_id: "my-ledger",
    date: document.getElementById("fDate").value,
    name: document.getElementById("fName").value.trim(),
    category: document.getElementById("fCat").value.trim() || "其他",
    amount: Number(document.getElementById("fAmount").value),
    type: currentType,
    note: document.getElementById("fNote").value.trim()
  };
  if(!rec.date){toast("請選日期");return;}
  if(!rec.name){toast("請填名稱");return;}
  if(isNaN(rec.amount)){toast("請填金額");return;}
  try{
    await sb.from("transactions").insert(rec);
    toast(currentType === "income" ? "✅ 收入已入帳" : "✅ 支出已記錄");
    doClear();
    await loadData();
  }catch(e){
    toast("❌ 儲存失敗："+e.message);
  }
}
async function loadData(){
  toast("同步雲端...");
  try{
    const {data} = await sb.from("transactions").select("*").order("date",{ascending:false});
    allData = data || [];
    renderList();
    renderStat();
    toast("同步完成，共"+allData.length+"筆");
  }catch(e){
    toast("⚠️ 雲端連線失敗，本地仍可操作");
  }
}
function renderList(){
  const filter = document.getElementById("filterType").value;
  let data = [...allData];
  if(filter !== "all") data = data.filter(r=>r.type===filter);
  const box = document.getElementById("listBox");
  if(data.length===0){box.innerHTML="<p style='color:#999'>尚無記錄</p>";return;}
  let html = "<table><tr><th>日期</th><th>名稱</th><th>金額</th><th></th></tr>";
  data.forEach(r=>{
    html += `<tr>
    <td>${r.date}</td>
    <td>${r.name}<br><span class="tag">${r.category}</span></td>
    <td>${r.amount}</td>
    <td><button style="color:red;border:none;background:none;cursor:pointer;" onclick="doDel(${r.id})">刪除</button></td>
    </tr>`;
  });
  html += "</table>";
  box.innerHTML = html;
}
async function doDel(id){
  if(!confirm("確定刪除？")) return;
  toast("刪除中...");
  try{
    await sb.from("transactions").delete().eq("id",id);
    toast("已刪除");
    await loadData();
  }catch(e){toast("刪除失敗");}
}
function renderStat(){
  const s = document.getElementById("statStart").value;
  const e = document.getElementById("statEnd").value;
  let exp=0,inc=0;
  allData.forEach(r=>{
    if(r.date < s || r.date > e) return;
    if(r.type==="expense") exp += r.amount; else inc += r.amount;
  });
  document.getElementById("stExp").textContent = exp.toLocaleString();
  document.getElementById("stInc").textContent = inc.toLocaleString();
  let total=0; allData.forEach(r=> total += r.type==="income"?r.amount:-r.amount);
  document.getElementById("stTotal").textContent = total.toLocaleString();
}
function doExport(){
  toast("產生備份檔...");
  let csv = "date,name,category,amount,type,note\n";
  allData.forEach(r=> csv += `${r.date},"${r.name}",${r.category},${r.amount},${r.type},"${r.note||""}"\n`);
  const blob = new Blob(["\ufeff"+csv]);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `備份_${today()}.csv`;
  a.click();
  toast("✅ 備份已下載");
}
document.getElementById("impFile").addEventListener("change", async e=>{
  const f = e.target.files[0];
  if(!f) return;
  toast("讀取檔案...");
  const buf = await f.arrayBuffer();
  const wb = XLSX.read(buf, {type:"array"});
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, {header:0, defval:""});
  importRows = rows.slice(1);
  toast(`讀到 ${importRows.length} 筆，點確認匯入`);
  document.getElementById("btnImp").style.display = "block";
});
async function doImport(){
  toast("匯入中...");
  let ok=0;
  for(const row of importRows){
    try{
      await sb.from("transactions").insert({
        user_id:"my-ledger", date:row[0], name:row[1], category:row[2]||"其他", amount:Number(row[3]), type:row[4]||"expense", note:row[5]||""
      });
      ok++;
    }catch(e){}
  }
  toast(`匯入完成：成功${ok}筆`);
  await loadData();
}

// ========== 頁面打開後初始化 ==========
window.onload = function(){
  toast("程式啟動");
  try{
    sb = window.supabase.createClient(
      "https://htqhybhvsvekhqxsmjph.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh0cWh5Ymh2c3Zla2hxeHNtanBoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyMDY1MDgsImV4cCI6MjEwNTc4MjUwOH0.SaLSUCuPJLA6yTuSatUsfW7J77nSld_8DUiCypFwhAo"
    );
    document.getElementById("fDate").value = today();
    document.getElementById("statStart").value = new Date(new Date().getFullYear(),new Date().getMonth(),1).toISOString().slice(0,10);
    document.getElementById("statEnd").value = today();
    loadData();
    toast("🎉 全部按鈕已就緒");
  }catch(e){
    toast("⚠️ 雲端連線失敗，但所有按鈕仍可正常點擊");
  }
};
</script>
</body>
</html>
